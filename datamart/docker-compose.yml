# PostgreSQL server for the sample ODS and the data mart. Set POSTGRES_PASSWORD in a .env file next to this
# file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DATAMART_DB_PORT:-5440}:5432"
    volumes:
      - datamart-db:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

volumes:
  datamart-db:
