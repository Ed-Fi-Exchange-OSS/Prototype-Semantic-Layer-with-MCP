# PostgreSQL server for the sample ODS and the data mart, and the MCP server (profile "mcp"). Set the
# passwords in a .env file next to this file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MCP_READER_PASSWORD: ${MCP_READER_PASSWORD:?Set MCP_READER_PASSWORD in .env}
    ports:
      - "${DATAMART_DB_PORT:-5440}:5432"
    volumes:
      - datamart-db:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

  # Self-signed certificate for https://localhost, created once in ../mcp-server/certs. MCP clients must
  # trust it (see ../mcp-server/README.md).
  mcp-cert:
    profiles: [mcp]
    image: alpine:3.22.2
    volumes:
      - ../mcp-server/certs:/certs
    command:
      - sh
      - -c
      - >-
        [ -f /certs/server.crt ] || (apk add --no-cache openssl > /dev/null
        && openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -keyout /certs/server.key -out /certs/server.crt -subj /CN=localhost
        -addext subjectAltName=DNS:localhost,IP:127.0.0.1
        && chmod 644 /certs/server.key)

  mcp-server:
    profiles: [mcp]
    build: ../mcp-server
    environment:
      PGHOST: db
      PGDATABASE: edfi_datamart
      PGUSER: mcp_reader
      PGPASSWORD: ${MCP_READER_PASSWORD:?Set MCP_READER_PASSWORD in .env}
      # Sign-in through Keycloak; set OAUTH_ISSUER to empty in .env to use the demo user instead.
      OAUTH_ISSUER: ${OAUTH_ISSUER-https://localhost:8443/realms/edfi}
      OAUTH_JWKS_URL: http://keycloak:8080/realms/edfi/protocol/openid-connect/certs
      MCP_RESOURCE_URL: https://localhost:${MCP_PORT:-3000}/mcp
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-tina.blevins@RidgemontHighSchool.edu}
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
    volumes:
      - ../mcp-server/certs:/certs:ro
    ports:
      - "${MCP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mcp-cert:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  # Sign-in for the MCP server: Keycloak with an "edfi" realm like Ed-Fi Admin App's, on
  # https://localhost:8443 (same self-signed certificate). Port 8080 (plain HTTP) is only reachable inside the
  # Docker network.
  keycloak:
    profiles: [mcp]
    image: quay.io/keycloak/keycloak:26.1.5
    command:
      - start-dev
      - --import-realm
      - --hostname=https://localhost:${KEYCLOAK_PORT:-8443}
      - --hostname-backchannel-dynamic=true
      - --https-port=8443
      - --https-certificate-file=/certs/server.crt
      - --https-certificate-key-file=/certs/server.key
      - --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ../mcp-server/certs:/certs:ro
      - ../mcp-server/keycloak/realm-edfi.json:/opt/keycloak/data/import/realm-edfi.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8443}:8443"
    depends_on:
      mcp-cert:
        condition: service_completed_successfully

  # Creates the demo users (a teacher, a principal, the superintendent) once Keycloak is up.
  keycloak-users:
    profiles: [mcp]
    image: quay.io/keycloak/keycloak:26.1.5
    entrypoint: ["bash", "/scripts/create-demo-users.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
    volumes:
      - ../mcp-server/keycloak/create-demo-users.sh:/scripts/create-demo-users.sh:ro
    depends_on:
      - keycloak

volumes:
  datamart-db:
